name: Release

# Runs when you push a version tag such as v0.1.1 (use `npm run release`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload installers

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the installer and uploads it to the GitHub Release for this tag.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac signing is skipped until Apple certificate secrets are added (see README).
          CSC_IDENTITY_AUTO_DISCOVERY: false
