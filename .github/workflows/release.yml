name: Release

# Runs when you push a version tag such as v0.1.1 (use `npm run release`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload installers

jobs:
  # Start the real app and check its main features. If anything fails, nothing is released.
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Create the GitHub Release once, up front. Without this the Mac and Windows
  # jobs each create their own release for the same tag at the same moment,
  # which leaves two releases with half the installers in each.
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the installer and uploads it to the GitHub Release for this tag.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload to the release created above even when re-running an old build.
          EP_GH_IGNORE_TIME: true
          # No Apple certificate yet, so don't search the keychain for one. The app is
          # still ad-hoc signed (mac.identity "-" in package.json): an unsigned bundle
          # shows up as "damaged" on Apple Silicon once it has been downloaded.
          CSC_IDENTITY_AUTO_DISCOVERY: false
